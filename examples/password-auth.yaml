databases:
  - name: orders-primary
    host: orders-db.example.com
    port: 5432
    dbname: orders
    username: orders_backend
    # Read from a file, such as a mounted Kubernetes Secret.
    password_file: /run/secrets/orders_backend_password
    sslmode: verify-full
  - name: reports-primary
    host: reports-db.example.com
    port: 5432
    dbname: reports
    username: reports_backend
    # Read from an environment variable.
    password_env: REPORTS_BACKEND_PASSWORD
    sslmode: verify-full
clusters:
  orders: {primary: orders-primary}
  reports: {primary: reports-primary}
logical_databases:
  orders: {cluster: orders}
  reports: {cluster: reports}
proxy:
  listener_address: "0.0.0.0:15432"
  password_auth_enabled: true
  tls_required: true
  tls_cert_file: "/etc/pg-proxy/server.crt"
  tls_key_file: "/etc/pg-proxy/server.key"
users:
  - static_credentials:
      username: alice
      password_file: /run/secrets/alice_password
    databases: [orders]
  - static_credentials:
      username: bob
      scram_sha_256_file: /run/secrets/bob_scram_verifier
    databases: [orders, reports]
