name: Bug report or feature request
description: Report a bug, propose a feature, or ask a question about PG Proxy.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for opening an issue. **Do not report security vulnerabilities here.** Email security@datadoghq.com instead.

  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - Bug
        - Feature request
        - Documentation
        - Question
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        **Bug:** what happened, and what you expected instead.
        **Feature:** the problem you want to solve and why it matters, then how you'd like it to work.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce (bugs)
      description: A minimal config plus a short script or SQL sequence is ideal.

  - type: textarea
    id: versions
    attributes:
      label: Versions and environment (bugs)
      value: |
        - PG Proxy (tag or commit SHA):
        - PostgreSQL (`SELECT version();`):
        - OS / architecture:
        - Go (`go version`, if you built it):
        - Client driver or tool:

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The relevant parts of your PG Proxy config. **Remove passwords and other secrets.**
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs (bugs)
      description: Relevant PG Proxy output. If you can reproduce it, run with `--log-level DEBUG`.
      render: text
