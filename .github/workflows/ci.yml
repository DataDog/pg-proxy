name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '1'
  GOENV: 'off'
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  license-headers:
    name: Go license headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Go license headers
        run: go run github.com/apache/skywalking-eyes/cmd/license-eye@v0.9.0 header check

  go:
    name: Go (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [minimum, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum Go
        if: matrix.toolchain == 'minimum'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up stable Go
        if: matrix.toolchain == 'stable'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Report toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          cc --version
      - name: Check formatting and module definitions
        if: matrix.toolchain == 'minimum'
        run: |
          unformatted_go_files=$(gofmt -l .)
          if [[ -n "$unformatted_go_files" ]]; then
            printf '%s\n' "$unformatted_go_files"
            exit 1
          fi
          go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet -tags=integration ./...
      - name: Unit tests on minimum Go
        if: matrix.toolchain == 'minimum'
        run: go test -count=1 -timeout=10m ./...
      - name: Unit tests with race detection on stable Go
        if: matrix.toolchain == 'stable'
        run: go test -race -count=1 -timeout=10m ./...

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Check Docker
        run: docker info
      - name: Integration tests
        run: go test -tags=integration -race -count=1 -timeout=15m -v ./...

  docs:
    name: Documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static site and check links
        run: npm run build:static
