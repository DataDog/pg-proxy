name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '1'
  GOENV: 'off'
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  go:
    name: Go (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [minimum, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum Go
        if: matrix.toolchain == 'minimum'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up stable Go
        if: matrix.toolchain == 'stable'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Report toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          cc --version
      - name: Check formatting and module definitions
        if: matrix.toolchain == 'minimum'
        run: |
          unformatted_go_files=$(gofmt -l .)
          if [[ -n "$unformatted_go_files" ]]; then
            printf '%s\n' "$unformatted_go_files"
            exit 1
          fi
          go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests on minimum Go (Docker tests excluded)
        if: matrix.toolchain == 'minimum'
        run: go test -skip '^TestProxyAgainstPostgres$' -count=1 -timeout=10m ./...
      - name: Unit tests with race detection (Docker tests excluded)
        if: matrix.toolchain == 'stable'
        run: go test -race -skip '^TestProxyAgainstPostgres$' -count=1 -timeout=10m ./...

  integration-build:
    name: Compile integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      # Execute Docker-backed tests after portable fixtures are configured.
      - name: Compile integration tests without running them
        run: go test -tags=integration -run '^$' ./...

  protocol-integration:
    name: Differential PostgreSQL protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGPROXY_TEST_ARTIFACT_DIR: ${{ github.workspace }}/protocol-artifacts
      PGPROXY_TEST_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Report Docker and source revision
        run: |
          docker version
          git rev-parse HEAD
      - name: Run differential protocol corpus
        run: go test -tags=integration -count=1 -timeout=10m -v ./internal/protocoltest/integration
      - name: Upload protocol failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-failures-${{ github.sha }}
          path: protocol-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  client-integration:
    name: Client authentication and TLS integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PG_PROXY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Start disposable PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
      - name: Run real client integration tests with race detection
        run: go test -race -run '^TestProxyAgainstPostgres$' -count=1 -timeout=5m ./cmd/pg-proxy
