# Metrics-only example for otelcol-contrib 0.163.2.
# Set DD_API_KEY and DD_SITE on the Collector, and configure the proxy with
# OTEL_METRICS_EXPORTER=otlp and
# OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta.
# Start the Collector with:
# otelcol-contrib --config otel-collector-datadog.yaml \
#   --feature-gates=exporter.datadogexporter.InferIntervalForDeltaMetrics
# Interval inference is required to divide each delta count by its duration.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  transform/pg_proxy_datadog_rates:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - >-
            set(datapoint.attributes["datadog.metric.as_type"], "rate")
            where instrumentation_scope.name == "pg-proxy"
            and IsMatch(metric.name, "^dd[.]orgstore[.]pg_proxy[.]")
            and metric.type == METRIC_DATA_TYPE_SUM
            and metric.is_monotonic == true
            and metric.aggregation_temporality == AGGREGATION_TEMPORALITY_DELTA
  batch: {}

exporters:
  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [transform/pg_proxy_datadog_rates, batch]
      exporters: [datadog]
